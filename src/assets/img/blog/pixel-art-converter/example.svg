<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Pixel Art Converter worked example</title>
  <desc id="desc">Example settings and expected result for Pixel Art Converter.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#4c1d95"/></linearGradient></defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)"/>
  <text x="70" y="82" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#c084fc" letter-spacing="2">WORKED EXAMPLE</text>
  <text x="70" y="145" font-size="48" fill="#ffffff" text-anchor="start">Pixel Art Converter</text>
  <text x="70" y="235" font-size="24" fill="#ffffff" fill-opacity=".72" text-anchor="start">Convert a photo into pixel art with palette reduction and optional dithering.</text>
  <g><rect x="70" y="300" width="500" height="70" rx="18" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".16"/><text x="92" y="343" font-family="Arial, sans-serif" font-size="21" fill="#ffffff">Photo: Photo</text></g><g><rect x="610" y="300" width="500" height="70" rx="18" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".16"/><text x="632" y="343" font-family="Arial, sans-serif" font-size="21" fill="#ffffff">Pixel size: 10</text></g><g><rect x="70" y="392" width="500" height="70" rx="18" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".16"/><text x="92" y="435" font-family="Arial, sans-serif" font-size="21" fill="#ffffff">Palette colours: 16</text></g><g><rect x="610" y="392" width="500" height="70" rx="18" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".16"/><text x="632" y="435" font-family="Arial, sans-serif" font-size="21" fill="#ffffff">Use dithering: true</text></g>
  <rect x="70" y="520" width="1060" height="92" rx="22" fill="#c084fc" fill-opacity=".14" stroke="#c084fc" stroke-opacity=".5"/>
  <text x="96" y="558" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fb7185">EXPECTED RESULT</text>
  <text x="96" y="590" font-size="24" fill="#ffffff" text-anchor="start">Pixel art</text>
</svg>