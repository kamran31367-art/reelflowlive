<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Online Audio Recorder worked example</title>
  <desc id="desc">Example settings and expected result for Online Audio Recorder.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#7f1d1d"/></linearGradient></defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)"/>
  <text x="70" y="82" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#fb7185" letter-spacing="2">WORKED EXAMPLE</text>
  <text x="70" y="145" font-size="48" fill="#ffffff" text-anchor="start">Online Audio Recorder</text>
  <text x="70" y="235" font-size="24" fill="#ffffff" fill-opacity=".72" text-anchor="start">Record microphone audio, replay it and download the recording.</text>

  <rect x="70" y="520" width="1060" height="92" rx="22" fill="#fb7185" fill-opacity=".14" stroke="#fb7185" stroke-opacity=".5"/>
  <text x="96" y="558" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#f59e0b">EXPECTED RESULT</text>
  <text x="96" y="590" font-size="24" fill="#ffffff" text-anchor="start">Recording</text>
</svg>