<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Date Countdown Calculator worked example</title>
  <desc id="desc">Example settings and expected result for Date Countdown Calculator.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#92400e"/></linearGradient></defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)"/>
  <text x="70" y="82" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#fbbf24" letter-spacing="2">WORKED EXAMPLE</text>
  <text x="70" y="145" font-size="48" fill="#ffffff" text-anchor="start">Date Countdown Calculator</text>
  <text x="70" y="235" font-size="24" fill="#ffffff" fill-opacity=".72" text-anchor="start">Count down to an important date with a live days, hours, minutes and seconds</text><text x="70" y="269" font-size="24" fill="#ffffff" fill-opacity=".72" text-anchor="start">display.</text>
  <g><rect x="70" y="300" width="500" height="70" rx="18" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".16"/><text x="92" y="343" font-family="Arial, sans-serif" font-size="21" fill="#ffffff">Target date and time: Target date and time</text></g>
  <rect x="70" y="520" width="1060" height="92" rx="22" fill="#fbbf24" fill-opacity=".14" stroke="#fbbf24" stroke-opacity=".5"/>
  <text x="96" y="558" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fb7185">EXPECTED RESULT</text>
  <text x="96" y="590" font-size="24" fill="#ffffff" text-anchor="start">Live countdown</text>
</svg>